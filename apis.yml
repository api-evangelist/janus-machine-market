apis:
- aid: janus-machine-market:janus-search-github-ingress
  name: JANUS.SEARCH GitHub Issues Ingress
  description: 'Places one bounded JANUS.SEARCH research order by opening a GitHub issue with a fixed title and
    a JANUS_BUYER_QUERY_SHADOW_JSON body marker (query up to 4000 UTF-8 bytes), then reads the reconciled result,
    with provenance and receipt lineage, from the issue comments. First order per external GitHub principal is free.
    Transport note: the host is api.github.com because the provider''s own AGENTS.md and MACHINE_INGRESS.json define
    the ingress as GitHub Issues on its repository Hawkar-usls/JANUS-MACHINE-MARKET; every path is scoped to that
    repository. The API surface is GitHub''s; the service behind it is JANUS Machine Market''s.'
