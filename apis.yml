  description: 'Requests one structural/policy-risk review of a public GitHub pull request, frozen at its exact
    40-hex head SHA (maximum 300 changed files; target code is never executed), by opening a GitHub issue with a
    JANUS_PR_REVIEW_PUBLIC_JSON body marker, and reads the result and receipt from the issue comments. First review
