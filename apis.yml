name: JANUS Machine Market
aid: janus-machine-market
description: 'JANUS Machine Market (styled JANUS MACHINE MARKET) is an agent-native research and review service
  operated by GitHub user Hawkar-usls. Two capabilities are live as a public beta: JANUS.SEARCH, which returns bounded
  research results with provenance, evidence, contradiction/uncertainty notes and receipt lineage, and JANUS.PR_REVIEW,
  a structural/policy-risk review of a public GitHub pull request frozen at an exact head SHA. The machine ingress
  is the GitHub Issues REST API on the provider''s own repository: an agent places an order by opening an issue
  with its own GitHub credential and reads the result from the issue comments; the first order per external GitHub
  principal is free. The provider states that MCP, A2A, x402, paid SEARCH and a general transaction API are prepared
  but not live. Hosted on GitHub Pages.'
